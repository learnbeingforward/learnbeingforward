<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password | Learn Being Forward</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-layout="public">

<header class="band" style="padding-bottom:180px">
  <div class="container"><div id="topbar"></div></div>
  <div class="container band-hero" style="margin-top:36px">
    <div class="eyebrow">Account recovery</div>
    <h1 style="font-size:34px">Forgot your <em>password?</em></h1>
    <p>Enter your account email and we'll send you a secure reset link.</p>
  </div>
</header>

<main class="container">
  <div class="row lift" style="margin-top:-140px;justify-content:center">
    <section class="card" style="flex:0 1 460px">
      <div class="label">Step 1 · Request link</div>
      <form class="stack" style="gap:16px;margin-top:14px">
        <label class="field"><span>Email <span class="req" aria-hidden="true">*</span></span><span class="input-group"><svg width="16" height="16"><use href="#i-mail"/></svg><input class="input" type="email" required></span></label>
        <button class="btn btn-primary" type="submit" style="width:100%">Send reset link</button>
        <a href="login.html" class="small" style="text-align:center">← Back to login</a>
      </form>
    </section>
    <section class="card" style="flex:0 1 460px;text-align:center">
      <div class="label">Step 2 · Link sent (state)</div>
      <span class="icon-box gold" style="width:64px;height:64px;border-radius:50%;margin:18px auto 0"><svg width="28" height="28"><use href="#i-mail"/></svg></span>
      <h2 class="h2" style="margin-top:14px">Check your inbox</h2>
      <p class="muted" style="margin-top:6px">If an account exists for <strong style="color:var(--text)">s***@college.edu</strong>, a reset link is on its way. It expires in 30 minutes.</p>
      <button class="btn" type="button" style="margin-top:18px" disabled>Resend in 0:42</button>
    </section>
  </div>
</main>

<script src="../assets/layout.js"></script>
</body>
</html>
