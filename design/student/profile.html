<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile | Learn Being Forward</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-layout="app" data-role="student" data-active="profile">
<header class="app-band"><div class="container">
<div id="topbar"></div>
<div class="page-head"><div><div class="crumb">Your details</div><h1>Profile</h1><p>Keep your details and CV up to date for placements.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"></div></div>
</div></header>
<main class="container"><div class="lift stack">
<div class="row"><section class="card grow"><div class="split" style="margin-bottom:18px"><div><h2 class="h2">Your details</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="stack" style="gap:16px"><div class="stat-inline"><span class="avatar lg">AJ</span><button class="btn btn-sm" type="button" ><svg width="16" height="16" aria-hidden="true"><use href="#i-upload"/></svg>Upload photo</button></div><div class="grid" style="--min:220px"><label class="field"><span>Full name <span class="req" aria-hidden="true">*</span></span><input class="input" type="text" value="Aadhya Joshi"></label><label class="field"><span>Email</span><input class="input" value="aadhya.joshi6@extradata.in" disabled></label><label class="field"><span>College</span><input class="input" value="Crestview College of Engineering" disabled></label></div><div class="grid" style="--min:200px"><label class="field"><span>Branch</span><select class="select"><option>Electronics &amp; Communication</option></select></label><label class="field"><span>Semester</span><select class="select"><option>3</option></select></label><label class="field"><span>USN / roll number</span><input class="input" type="text"></label><label class="field"><span>Father's name</span><input class="input" type="text"></label></div><div class="field">CV / resume<div class="list-row"><svg width="20" height="20" aria-hidden="true"><use href="#i-file"/></svg><span class="grow small">No CV uploaded — placement teams can't share your profile yet.</span><button class="btn btn-primary btn-sm" type="button" ><svg width="16" height="16" aria-hidden="true"><use href="#i-upload"/></svg>Upload CV</button></div></div><div class="split"><span class="hint">Email and college are managed by your college.</span><button class="btn btn-primary" type="button" >Save</button></div></div></section><section class="card side"><div class="split" style="margin-bottom:18px"><div><h2 class="h2">Change password</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="stack" style="gap:14px"><label class="field"><span>Current password <span class="req" aria-hidden="true">*</span></span><input class="input" type="password"></label><label class="field"><span>New password <span class="req" aria-hidden="true">*</span></span><input class="input" type="password"></label><button class="btn btn-primary" type="button" ><svg width="16" height="16" aria-hidden="true"><use href="#i-lock"/></svg>Change password</button></div></section></div>
</div></main>
<script src="../assets/nav.js"></script>
<script src="../assets/layout.js"></script>

</body>
</html>
