<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Builder · Learn Being Forward</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--navy:#1C2B4A;--navy-2:#24365C;--navy-3:#2E4370;--gold:#C9973C;--gold-soft:#F6EBD3;--gold-text:#8A6420;--cream:#FAF7F0;--surface:#F4F1E8;--text:#1E2533;--muted:#5D6472;--on-navy:#B7C1D6;--border:#E4DFD3;--border-2:#CFC8B8;
--success:#1F8A4C;--success-soft:#E5F4EB;--success-text:#166534;--warning-soft:#FFF3E0;--warning-text:#92400E;--danger:#B91C1C;--danger-soft:#FDECEC;--danger-text:#7F1D1D;--info:#1E4FBF;--info-soft:#EAF0FC;--info-text:#1E3A8A;
--shadow:0 8px 30px rgba(28,43,74,.12);--font:'Poppins',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--cream);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy);font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.strong{font-weight:600}.mono{font-family:var(--mono)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hidden{display:none!important}

/* buttons, pills, inputs */
.btn{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--border-2);background:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--navy)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn-gold:hover{background:#D6A54B}
.btn-ghost{background:transparent;border-color:var(--navy-3);color:#fff}.btn-ghost:hover{border-color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-o{color:var(--danger);border-color:#F1B4B4}
.btn-sm{height:32px;padding:0 10px;font-size:11px}
.btn-icon{width:32px;height:32px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);color:#3B4252;white-space:nowrap}
.pill.success{background:var(--success-soft);color:var(--success-text)}.pill.warning{background:var(--warning-soft);color:var(--warning-text)}.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.gold{background:var(--gold-soft);color:var(--gold-text)}.pill.navy{background:var(--navy);color:#fff}
.input,.select,.textarea{width:100%;height:38px;border:1px solid var(--border-2);border-radius:8px;padding:0 10px;font-size:13px;background:#fff}
.textarea{height:auto;padding:8px 10px;resize:vertical}
.input.error{border-color:var(--danger)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(201,151,60,.3)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#3B4252}
.field .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--navy);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{height:32px;padding:0 12px;border:0;border-left:1px solid var(--border-2);background:none;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.seg button:first-child{border-left:0}.seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
.seg.dark{border-color:var(--navy-3);background:transparent}.seg.dark button{color:#D5DCEA;border-color:var(--navy-3)}.seg.dark button[aria-pressed=true]{background:var(--gold);color:var(--navy)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:13px}
.alert.info{background:var(--info-soft);color:var(--info-text)}.alert.success{background:var(--success-soft);color:var(--success-text)}.alert.warning{background:var(--warning-soft);color:#7C2D12}.alert.danger{background:var(--danger-soft);color:var(--danger-text)}.alert.gold{background:var(--gold-soft);color:#5C4214}
.card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:24px}
.box{border:1px solid var(--border);border-radius:12px;background:#fff;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(var(--min,240px),1fr))}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.icon-box{width:36px;height:36px;border-radius:9px;background:var(--gold-soft);color:var(--gold-text);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-box.navy{background:var(--navy);color:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--surface);text-align:left;padding:10px 14px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.t td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:middle}
.t-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;background:#fff}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--border-2);border-radius:4px;background:#fff}

/* ---------------- app shell ---------------- */
.app-band{background:var(--navy);color:#fff;padding:14px 24px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff;text-decoration:none}
.brand .f{color:var(--gold)}.brand svg{color:var(--gold)}
.brand .sep{width:1px;height:22px;background:var(--navy-3);margin:0 4px}
.brand .sb{font-weight:600;color:#D5DCEA;font-size:14px}
.role-pill{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--gold);color:var(--navy)}
.user-chip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--navy-2);font-size:12px}
.user-chip .avatar{background:var(--gold);color:var(--navy);width:30px;height:30px}
.tabsbar{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tabsbar button{height:42px;padding:0 14px;border:0;background:none;color:#D5DCEA;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabsbar button:hover{color:#fff}
.tabsbar button[aria-selected=true]{color:#fff;font-weight:700;border-bottom-color:var(--gold)}
.tabsbar .count{background:var(--navy-3);border-radius:999px;padding:1px 7px;font-size:11px}
.view{padding:24px;max-width:1360px;margin:0 auto}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-size:24px}

/* ---------------- editor ---------------- */
.editor{display:grid;grid-template-columns:300px 1fr 320px;grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 112px);min-height:620px}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);grid-column:1/-1}
.edbar .pname{font-weight:700;font-size:15px;border:1px dashed transparent;border-radius:6px;padding:2px 6px}
.edbar .pname:hover{border-color:var(--border-2)}
.edbar .saved{font-size:12px;color:var(--success-text);display:inline-flex;gap:6px;align-items:center}
.lib,.props{background:#fff;overflow:auto;border-right:1px solid var(--border)}
.props{border-right:0;border-left:1px solid var(--border)}
.lib-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2}
.lib-tabs button{flex:1;height:42px;border:0;background:none;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.lib-tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--gold)}
.lib-search{padding:12px;position:sticky;top:42px;background:#fff;z-index:2;border-bottom:1px solid var(--border)}
.lib-group{border-bottom:1px solid var(--border)}
.lib-group>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.lib-group>summary::-webkit-details-marker{display:none}
.lib-group>summary .chev{margin-left:auto;transition:transform .15s}
.lib-group[open]>summary .chev{transform:rotate(90deg)}
.lib-page{padding:0 12px 10px}
.lib-page .pg{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 6px}
.lib-item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:#fff;cursor:grab;user-select:none;font-size:12.5px}
.lib-item:hover{border-color:var(--gold);box-shadow:0 3px 10px rgba(28,43,74,.08)}
.lib-item:active{cursor:grabbing}
.lib-item .ic{width:28px;height:28px;border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.lib-item .nm{flex:1;min-width:0;line-height:1.25}
.lib-item .nm small{display:block;color:var(--muted);font-size:10.5px}
.lib-item .add{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.lib-item .add:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.lib-item.lock{opacity:.6}
.layouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.layout-tile{border:1px solid var(--border);border-radius:9px;padding:10px;cursor:grab;background:#fff;text-align:center;font-size:11px;font-weight:600}
.layout-tile:hover{border-color:var(--gold)}
.layout-tile .lt{display:grid;gap:4px;height:34px;margin-bottom:6px}
.layout-tile .lt span{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:4px}

.stage{overflow:auto;background:#ECE7DA;padding:24px;position:relative}
.stage .frame{margin:0 auto;background:var(--cream);box-shadow:0 10px 40px rgba(28,43,74,.18);border-radius:10px;overflow:hidden;transition:width .25s;min-height:600px}
.cv-band{background:var(--navy);color:#fff;padding:12px 22px 70px}
.cv-top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.cv-menu{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--navy-3)}
.cv-menu span{padding:5px 10px;border-radius:999px;font-size:11.5px;color:#D5DCEA}
.cv-menu span.on{background:var(--navy-3);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
.cv-title{margin-top:18px}
.cv-title [contenteditable]{outline:none;border-radius:6px;padding:2px 4px;margin-left:-4px;border:1px dashed transparent}
.cv-title [contenteditable]:hover{border-color:var(--navy-3)}
.cv-title [contenteditable]:focus{border-color:var(--gold);background:var(--navy-2)}
.cv-title h2{font-size:22px;color:#fff}.cv-title p{color:var(--on-navy);font-size:13px}
.cv-body{margin:-50px 18px 0;padding-bottom:30px;position:relative}
.cv-row{position:relative;margin-bottom:4px;border-radius:12px;border:1.5px dashed transparent;padding:4px}
.cv-row:hover{border-color:var(--border-2)}
.cv-row.sel{border-color:var(--gold);border-style:solid}
.row-tools{position:absolute;top:-14px;left:12px;display:none;gap:4px;z-index:3;background:var(--navy);border-radius:7px;padding:3px}
.cv-row:hover>.row-tools,.cv-row.sel>.row-tools{display:flex}
.row-tools button{height:24px;min-width:24px;border:0;background:transparent;color:#fff;border-radius:5px;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 6px}
.row-tools button:hover{background:var(--navy-3)}
.cv-cols{display:grid;gap:14px}
.cv-col{min-width:0;border-radius:10px;min-height:60px}
.cv-col.drag-over-col{background:rgba(201,151,60,.08)}
.blk{position:relative;user-select:none;-webkit-user-select:none;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(28,43,74,.08);padding:16px;outline:2px solid transparent;transition:outline-color .1s;cursor:pointer}
.blk:hover{outline-color:#E8D3A8}
.blk.sel{outline-color:var(--gold)}
.blk.warn{box-shadow:0 0 0 2px #F59E0B inset}
.blk.dragging{opacity:.35}
.blk-tools{position:absolute;top:-13px;right:10px;display:none;gap:2px;background:var(--navy);border-radius:7px;padding:3px;z-index:4}
.blk:hover .blk-tools,.blk.sel .blk-tools{display:flex}
.blk-tools button{width:24px;height:24px;border:0;background:none;color:#fff;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.blk-tools button:hover{background:var(--navy-3)}
.blk-tools .grip{cursor:grab}
.blk-tag{position:absolute;top:-10px;left:12px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--navy);padding:2px 7px;border-radius:999px;display:none}
.blk.sel .blk-tag,.blk:hover .blk-tag{display:block}
.warn-strip{margin:-16px -16px 12px;padding:6px 12px;background:#FFF3E0;color:#7C2D12;font-size:11.5px;border-radius:12px 12px 0 0;display:flex;gap:6px;align-items:center}
.dz{height:14px;border-radius:6px;margin:1px 0;transition:background .12s,height .12s}
.dz.over{height:46px;background:rgba(201,151,60,.15);border:2px dashed var(--gold)}
.dz.row-dz.over{height:56px}
body.dragging .dz{background:rgba(28,43,74,.05)}
body.dragging .row-tools,body.dragging .blk-tools,body.dragging .blk-tag{display:none!important}
body.dragging .dz.over{height:46px;background:rgba(201,151,60,.18)}
.col-empty{border:1.5px dashed var(--border-2);border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px;background:rgba(255,255,255,.5)}
.col-empty.over{border-color:var(--gold);background:rgba(201,151,60,.12);color:var(--gold-text)}
.page-empty{background:#fff;border:2px dashed var(--border-2);border-radius:14px;padding:50px 20px;text-align:center;color:var(--muted)}
.page-empty.over{border-color:var(--gold);background:var(--gold-soft)}
.device-tablet .cv-cols{grid-template-columns:1fr!important}
.device-phone .cv-cols{grid-template-columns:1fr!important}
.device-phone .cv-menu{display:none}

/* mini renderers inside blocks */
.m-title{font-weight:700;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.m-tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.m-tile{background:var(--surface);border-radius:9px;padding:12px}
.m-tile b{display:block;font-size:20px;margin-top:4px}
.m-tile.g{background:var(--gold-soft)}.m-tile.s{background:var(--success-soft)}
.m-bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.m-bars i{display:block;width:100%;max-width:28px;background:var(--navy);border-radius:5px 5px 0 0}
.m-bars i.g{background:var(--gold)}
.m-list{display:flex;flex-direction:column;gap:6px}
.m-li{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px}
.m-li .grow{flex:1;min-width:0}
.m-table{width:100%;border-collapse:collapse;font-size:11.5px}
.m-table th{background:var(--surface);text-align:left;padding:7px 9px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m-table td{padding:7px 9px;border-top:1px solid var(--border)}
.m-form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.m-field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600}
.m-input{height:34px;border:1px solid var(--border-2);border-radius:7px;background:#fff;display:flex;align-items:center;padding:0 9px;color:#9AA0AA;font-weight:400;font-size:12px}
.m-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.m-card{border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px}
.m-ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.m-ring span{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.m-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.m-cal div{height:38px;border:1px solid var(--border);border-radius:5px;font-size:9.5px;padding:3px;background:#fff}
.m-cal div em{display:block;font-style:normal;background:var(--gold-soft);color:var(--gold-text);border-radius:3px;margin-top:2px;padding:0 2px;font-size:8.5px;font-weight:600}
.m-progress{height:7px;border-radius:999px;background:#E8E3D7;overflow:hidden}.m-progress i{display:block;height:100%;background:var(--success)}
.m-upload{border:1.5px dashed var(--border-2);border-radius:10px;padding:18px;text-align:center;background:var(--surface);font-size:12px;color:var(--muted)}
.m-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:10px}
.m-tabs span{padding:7px 10px;font-size:12px;color:var(--muted)}.m-tabs span.on{border-bottom:2px solid var(--gold);color:var(--text);font-weight:700}
.m-img{height:140px;border-radius:10px;background:repeating-linear-gradient(45deg,#EFEAE0,#EFEAE0 10px,#F6F2EA 10px,#F6F2EA 20px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.data-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--info-text);background:var(--info-soft);border-radius:999px;padding:2px 8px;font-weight:600}

/* copy & remove (trim) */
.trim{display:grid;grid-template-columns:290px 1fr 320px;grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 112px);min-height:620px}
.ttree{padding:8px 6px}
.tnode{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px}
.tnode.on{background:var(--gold-soft)}
.tnode .tname{flex:1;min-width:0;display:flex;gap:8px;align-items:center;border:0;background:none;text-align:left;cursor:pointer;font-size:13px;font-weight:600;padding:6px 0}
.tnode .tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tel{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(28,43,74,.08);padding:14px 16px}
.tel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tel-items{display:flex;flex-wrap:wrap;gap:8px}
.tel-items.tiles .titem,.tel-items.chart .titem{flex:1 1 140px;flex-direction:column;align-items:flex-start;background:var(--surface)}
.tel-items.table .titem{background:var(--surface);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tel-items.list .titem,.tel-items.form .titem{flex:1 1 100%}
.tel-items.cards .titem{flex:1 1 180px;min-height:60px}
.titem{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:9px 34px 9px 12px;font-size:13px;background:#fff}
.titem b{font-size:18px}
.titem .btn{margin-left:auto}
.titem-x{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:0;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;cursor:pointer}
.titem-x:hover{background:var(--danger);color:#fff}
.tel-items.tiles .titem-x,.tel-items.chart .titem-x{top:12px;transform:none}
.titem:has(.btn-primary){padding-right:12px}
.link-go{position:absolute;top:50%;right:34px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:1px solid var(--border-2);background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}

.link-crumb{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.sysrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border)}
.sysrow:hover{background:#FCFBF7}
.tabs-row{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 6px;overflow-x:auto}
.tabs-row button{height:40px;padding:0 12px;border:0;background:none;border-bottom:2px solid transparent;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--muted)}
.tabs-row button[aria-selected=true]{border-bottom-color:var(--gold);color:var(--text);font-weight:700}
.tabs-row .count{background:var(--surface);border-radius:999px;padding:0 7px;font-size:11px}

.ai-steps{display:flex;gap:8px;flex-wrap:wrap}
.ai-step{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#fff;font-size:13px;color:var(--muted);box-shadow:0 2px 8px rgba(28,43,74,.06)}
.ai-step span{width:26px;height:26px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.ai-step.on{color:var(--text);font-weight:700}.ai-step.on span{background:var(--navy);color:#fff}
.ai-step.done span{background:var(--success);color:#fff}
.cap-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cap{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;text-align:left;font-size:13px}
.cap span{flex:1}.cap:hover{border-color:var(--gold)}
.cap.on{border-color:var(--navy);background:#F5F7FB;font-weight:600}
.cap.on svg:last-child{color:var(--success)}

.pw-wrap{position:relative;display:block;flex:1;min-width:0}
.pw-wrap .input{padding-right:42px;width:100%}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:30px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.pw-eye:hover{color:var(--navy);background:var(--surface)}
.pw-eye[aria-pressed=true]{color:var(--navy)}
@media(max-width:1100px){.trim{grid-template-columns:260px 1fr}.trim .props{grid-column:1/-1}}
@media(max-width:760px){.trim{grid-template-columns:1fr;height:auto}}

.sub{position:relative;border-radius:9px}
.sub-x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid #fff;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.blk.sel .sub-x,.sub:hover>.sub-x{display:flex}
.blk.sel .sub{outline:1px dashed var(--border-2);outline-offset:2px;cursor:grab}
.sub.subover{outline:2px dashed var(--gold)!important;background:rgba(201,151,60,.1)}
.m-bars>.sub{flex:1;height:100%;display:flex}
.m-bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10px;color:var(--muted)}
.m-table th .sub{display:inline-block;padding-right:4px}
.item-row{display:flex;gap:6px;align-items:center}
.item-row .input,.item-row .select{height:32px;font-size:12.5px}
.item-row>span:first-child{width:16px;font-size:11px;text-align:right}

.props-head{padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2}

.props-sec .label{margin-bottom:-4px}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.toggle input{appearance:none;width:36px;height:20px;border-radius:999px;background:#D7D1C4;position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--navy)}.toggle input:checked::after{left:18px}
.outline-item{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;font-size:12px;cursor:pointer}
.outline-item:hover{background:var(--surface)}.outline-item.on{background:var(--gold-soft);font-weight:600}

.ov-bar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ov-body{flex:1;overflow:auto;padding:24px;background:#ECE7DA}

.modal.wide{max-width:760px}
.modal h2{font-size:20px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.danger-head{display:flex;gap:12px;align-items:flex-start}
.danger-head .icon-box{background:var(--danger-soft);color:var(--danger);width:44px;height:44px;border-radius:50%}
.impact{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.impact li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--danger-soft);border-radius:8px;font-size:13px;color:var(--danger-text)}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice label{border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.choice label:hover{border-color:var(--gold)}
.choice input{position:absolute;opacity:0}
.choice label:has(input:checked){border-color:var(--navy);background:#F7F8FB;box-shadow:inset 0 0 0 1px var(--navy)}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:up .2s}
.toast.warn{background:#7C2D12}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.menu-tree .mi{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#fff;margin-bottom:6px}
.menu-tree .mi.child{margin-left:34px;background:var(--surface)}
.menu-tree .mi input{border:0;background:transparent;font-weight:600;font-size:13px;flex:1;min-width:80px;padding:4px;border-radius:5px}
.menu-tree .mi input:focus{outline:2px solid var(--gold)}
.menu-tree .mi.dragover{border-color:var(--gold);box-shadow:0 -3px 0 var(--gold)}
.ghost-note{font-size:11.5px;color:var(--muted);margin-top:4px}
.portal-card{display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:18px}
.kpi{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(28,43,74,.06)}
.kpi b{display:block;font-size:24px;margin-top:4px}
.shortcuts{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
@media(max-width:1100px){.editor{grid-template-columns:260px 1fr;}.props{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);max-height:none}}
@media(max-width:760px){.editor{grid-template-columns:1fr;height:auto}.lib{max-height:320px}}
/* m-sb-fix */@media (max-width:900px){.tabsbar{flex-wrap:wrap;overflow:visible!important}.tabsbar>*{flex:1 1 auto}}

  <div class="cv-title"><h2 ${preview?'':'contenteditable="true" data-edit="name" spellcheck="false"'}>${esc(page.name)}</h2><p ${preview?'':'contenteditable="true" data-edit="subtitle" spellcheck="false"'}>${esc(page.subtitle||'Add a subtitle')}</p></div></div><div class="cv-body">`;
 if(!page.rows.length&&!preview){h+=`<div class="page-empty dz-page" data-dz="row" data-index="0"><div style="font-size:34px;color:var(--gold)">${ic('layers',34)}</div><h3 style="margin-top:8px;color:var(--text)">Drag sections here</h3><p style="margin-top:4px">Pick anything from the left — an existing section, a basic block or a layout.<br>Or click the <b>+</b> next to an item.</p></div>`;}
 page.rows.forEach((r,ri)=>{
  if(!preview)h+=`<div class="dz row-dz" data-dz="row" data-index="${ri}"></div>`;
  h+=`<div class="cv-row ${UI.sel&&UI.sel.row===r.id&&!UI.sel.block?'sel':''}" data-row="${r.id}">`;
  if(!preview)h+=`<div class="row-tools"><button data-act="row-sel" data-row="${r.id}" title="Row settings">${ic('rows',13)} Row</button><button data-act="row-up" data-row="${r.id}" aria-label="Move row up">${ic('up',13)}</button><button data-act="row-down" data-row="${r.id}" aria-label="Move row down">${ic('down',13)}</button><button data-act="row-dup" data-row="${r.id}" aria-label="Duplicate row">${ic('copy',13)}</button><button data-act="row-del" data-row="${r.id}" aria-label="Delete row">${ic('trash',13)}</button></div>`;
  h+=`<div class="cv-cols" style="grid-template-columns:${cols(r.layout)}">`;
  r.cols.forEach(c=>{
   h+=`<div class="cv-col" data-col="${c.id}">`;
   if(!c.blocks.length&&!preview)h+=`<div class="col-empty" data-dz="block" data-row="${r.id}" data-col="${c.id}" data-index="0">${ic('plus',14)}&nbsp;Drop a section here</div>`;
   c.blocks.forEach((b,bi)=>{
    if(!preview)h+=`<div class="dz" data-dz="block" data-row="${r.id}" data-col="${c.id}" data-index="${bi}"></div>`;
    const inner=renderBlock(b,page,preview);if(preview&&!inner)return;
    const warn=!BY_ID[b.type].roles.includes(roleOf(page.portal));
    h+=preview?`<div class="blk" style="cursor:default;margin-bottom:14px">${inner}</div>`:`<div class="blk ${UI.sel&&UI.sel.block===b.id?'sel':''} ${warn?'warn':''}" data-block="${b.id}" draggable="true" tabindex="0" aria-label="${esc(BY_ID[b.type].name)}"><span class="blk-tag">${esc(BY_ID[b.type].name)}</span><div class="blk-tools"><button class="grip" title="Drag to move" aria-label="Drag to move">${ic('grip',13)}</button><button data-act="blk-up" data-block="${b.id}" aria-label="Move up">${ic('up',13)}</button><button data-act="blk-down" data-block="${b.id}" aria-label="Move down">${ic('down',13)}</button><button data-act="blk-dup" data-block="${b.id}" aria-label="Duplicate">${ic('copy',13)}</button><button data-act="blk-del" data-block="${b.id}" aria-label="Delete">${ic('trash',13)}</button></div>${inner}</div>`;
    if(!preview&&bi===c.blocks.length-1)h+=`<div class="dz" data-dz="block" data-row="${r.id}" data-col="${c.id}" data-index="${bi+1}"></div>`;
   });
   h+=`</div>`;});
  h+=`</div></div>`;});
 if(page.rows.length&&!preview)h+=`<div class="dz row-dz" data-dz="row" data-index="${page.rows.length}" style="height:40px;border:1.5px dashed var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">${ic('plus',13)}&nbsp;Drop here to add a new row at the bottom</div>`;
 return h+`</div>`;
}

/* ---------- mutations (with undo) ---------- */
function snap(){const p=curPage();UI.undo.push(JSON.stringify({rows:p.rows,name:p.name,subtitle:p.subtitle}));if(UI.undo.length>60)UI.undo.shift();UI.redo=[];}
function touch(msg){const p=curPage();p.updated=now();if(p.status==='Published')p.status='Unpublished changes';save();UI.savedAt=now();if(msg)toast(msg);}
function findBlock(id){const p=curPage();for(const r of p.rows)for(const c of r.cols){const i=c.blocks.findIndex(b=>b.id===id);if(i>-1)return {r,c,i,b:c.blocks[i]};}return null;}
function addBlock(type,target){const p=curPage();const c=BY_ID[type];snap();const b=newBlock(type);
 if(target&&target.col){const r=p.rows.find(x=>x.id===target.row);const col=r.cols.find(x=>x.id===target.col);col.blocks.splice(target.index,0,b);}
 else{const idx=target&&target.rowIndex!=null?target.rowIndex:p.rows.length;p.rows.splice(idx,0,{id:uid('r'),layout:'1',cols:[{id:uid('c'),blocks:[b]}]});}
 UI.sel={block:b.id};touch();
 if(!c.roles.includes(roleOf(p.portal)))toast(`“${c.name}” isn't available to ${portal(p.portal).name} users — it will stay hidden for them.`,true);else toast(`Added “${c.name}”`);
 render();}
function addRow(layout,rowIndex){const p=curPage();snap();const r={id:uid('r'),layout,cols:LAYOUTS[layout].map(()=>({id:uid('c'),blocks:[]}))};p.rows.splice(rowIndex??p.rows.length,0,r);UI.sel={row:r.id};touch(`Added a ${LAYOUT_NAMES[layout].toLowerCase()} row`);render();}
function moveBlock(id,target){const p=curPage();const f=findBlock(id);if(!f)return;snap();f.c.blocks.splice(f.i,1);
 if(target.col){const r=p.rows.find(x=>x.id===target.row);const col=r.cols.find(x=>x.id===target.col);let idx=target.index;if(col===f.c&&f.i<idx)idx--;col.blocks.splice(idx,0,f.b);}
 else p.rows.splice(target.rowIndex,0,{id:uid('r'),layout:'1',cols:[{id:uid('c'),blocks:[f.b]}]});
 if(f.r.layout==='1'&&f.r.cols.every(c=>!c.blocks.length)){const k=p.rows.indexOf(f.r);if(k>-1)p.rows.splice(k,1);} // drop the now-empty single-column row
 UI.sel={block:id};touch();render();}
function setLayout(rowId,layout){const p=curPage();const r=p.rows.find(x=>x.id===rowId);snap();const n=LAYOUTS[layout].length;
 while(r.cols.length<n)r.cols.push({id:uid('c'),blocks:[]});
 while(r.cols.length>n){const extra=r.cols.pop();r.cols[r.cols.length-1].blocks.push(...extra.blocks);}
 r.layout=layout;touch();render();}
function doUndo(){if(!UI.undo.length)return;const p=curPage();UI.redo.push(JSON.stringify({rows:p.rows,name:p.name,subtitle:p.subtitle}));Object.assign(p,JSON.parse(UI.undo.pop()));save();toast('Undone');render();}
function doRedo(){if(!UI.redo.length)return;const p=curPage();UI.undo.push(JSON.stringify({rows:p.rows,name:p.name,subtitle:p.subtitle}));Object.assign(p,JSON.parse(UI.redo.pop()));save();toast('Redone');render();}
function act(a,el){const p=curPage();const id=el.dataset.block,rid=el.dataset.row;
 if(a==='blk-del'){const f=findBlock(id);snap();f.c.blocks.splice(f.i,1);UI.sel=null;touch('Section removed — press Undo to bring it back');}
 if(a==='blk-dup'){const f=findBlock(id);snap();const nb=JSON.parse(JSON.stringify(f.b));nb.id=uid('b');f.c.blocks.splice(f.i+1,0,nb);UI.sel={block:nb.id};touch('Duplicated');}
 if(a==='blk-up'||a==='blk-down'){const f=findBlock(id);const d=a==='blk-up'?-1:1;const j=f.i+d;snap();
   if(j>=0&&j<f.c.blocks.length){[f.c.blocks[f.i],f.c.blocks[j]]=[f.c.blocks[j],f.c.blocks[f.i]];}
   else{const ri=p.rows.indexOf(f.r);const nr=ri+d;if(nr>=0&&nr<p.rows.length){f.c.blocks.splice(f.i,1);const tc=p.rows[nr].cols[0];d<0?tc.blocks.push(f.b):tc.blocks.unshift(f.b);}}
   touch();}
 if(a==='row-sel'){UI.sel={row:rid};}
 if(a==='row-up'||a==='row-down'){const i=p.rows.findIndex(r=>r.id===rid);const j=i+(a==='row-up'?-1:1);if(j>=0&&j<p.rows.length){snap();[p.rows[i],p.rows[j]]=[p.rows[j],p.rows[i]];touch();}}
 if(a==='row-dup'){const i=p.rows.findIndex(r=>r.id===rid);snap();const nr=JSON.parse(JSON.stringify(p.rows[i]));nr.id=uid('r');nr.cols.forEach(c=>{c.id=uid('c');c.blocks.forEach(b=>b.id=uid('b'))});p.rows.splice(i+1,0,nr);touch('Row duplicated');}
 if(a==='row-del'){const i=p.rows.findIndex(r=>r.id===rid);snap();p.rows.splice(i,1);UI.sel=null;touch('Row removed — press Undo to bring it back');}
 render();}

/* ---------- library panel ---------- */
function libItem(c,page){const ok=c.roles.includes(roleOf(page.portal));return `<div class="lib-item ${ok?'':'lock'}" draggable="true" data-add="${c.id}" title="${ok?'Drag onto the page':'Not available for this portal'}"><span class="ic">${ic(c.icon,15)}</span><span class="nm">${esc(c.name)}${c.data&&c.data!=='—'?`<small>${esc(c.data)}</small>`:''}${!ok?`<small style="color:var(--warning-text)">Not for ${esc(portal(page.portal).name)}</small>`:''}</span><button class="add" data-add-click="${c.id}" aria-label="Add ${esc(c.name)}">${ic('plus',13)}</button></div>`;}
function renderLib(page){
 const q=UI.libQ.toLowerCase();const match=c=>!q||(c.name+c.page+c.data).toLowerCase().includes(q);
 let h=`<div class="lib-tabs" role="tablist"><button role="tab" aria-selected="${UI.libTab==='sections'}" data-libtab="sections">Sections</button><button role="tab" aria-selected="${UI.libTab==='basics'}" data-libtab="basics">Basics</button><button role="tab" aria-selected="${UI.libTab==='layouts'}" data-libtab="layouts">Layouts</button><button role="tab" aria-selected="${UI.libTab==='outline'}" data-libtab="outline">Outline</button></div>`;
 if(UI.libTab!=='layouts'&&UI.libTab!=='outline')h+=`<div class="lib-search"><div style="position:relative">${'<span style="position:absolute;left:10px;top:11px;color:var(--muted)">'+ic('search',14)+'</span>'}<input class="input" id="libq" placeholder="Search sections…" value="${esc(UI.libQ)}" style="padding-left:32px" aria-label="Search sections"></div></div>`;
 if(UI.libTab==='sections'){
  const order=[roleOf(page.portal),...['student','college','trainer','super-admin','public'].filter(x=>x!==roleOf(page.portal))];
  order.forEach(pid=>{const items=CAT.filter(c=>c.portal===pid&&match(c));if(!items.length)return;const pages=[...new Set(items.map(i=>i.page))];
   const open=UI.openGroups[pid]||q||pid===roleOf(page.portal);
   h+=`<details class="lib-group" ${open?'open':''} data-group="${pid}"><summary><span class="icon-box ${pid===roleOf(page.portal)?'navy':''}" style="width:28px;height:28px">${ic(portal(pid).icon,14)}</span>${esc(portal(pid).name)} pages<span class="pill" style="margin-left:6px">${items.length}</span><span class="chev">${ic('chevR',14)}</span></summary><div class="lib-page">${pages.map(pg=>`<div class="pg">${esc(pg)}</div>${items.filter(i=>i.page===pg).map(i=>libItem(i,page)).join('')}`).join('')}</div></details>`;});
 }
 if(UI.libTab==='basics'){h+=`<div class="lib-page"><div class="pg">Content &amp; data blocks</div>${BASICS.filter(match).map(c=>libItem(c,page)).join('')}<div class="pg">Form fields <span style="text-transform:none;letter-spacing:0;font-weight:400">— drop inside a column</span></div>${FIELDS.filter(match).map(c=>libItem(c,page)).join('')}</div>`;}
 if(UI.libTab==='layouts'){h+=`<p class="small muted" style="padding:12px 12px 0">Drag a layout onto the page to add an empty row, then drop sections into its columns.</p><div class="layouts">${Object.keys(LAYOUTS).map(k=>`<div class="layout-tile" draggable="true" data-layout="${k}"><div class="lt" style="grid-template-columns:${cols(k)}">${LAYOUTS[k].map(()=>'<span></span>').join('')}</div>${LAYOUT_NAMES[k]}<button class="add" style="display:none"></button></div>`).join('')}</div><div style="padding:0 12px 12px"><button class="btn btn-sm" style="width:100%" data-addrow="2">${ic('plus',13)} Add two-column row</button></div>`;}
 if(UI.libTab==='outline'){h+=`<div style="padding:10px">${page.rows.length?page.rows.map((r,i)=>`<div class="outline-item ${UI.sel&&UI.sel.row===r.id&&!UI.sel.block?'on':''}" data-pick-row="${r.id}">${ic('rows',13)}<b>Row ${i+1}</b><span class="muted small">· ${LAYOUT_NAMES[r.layout]}</span></div>${r.cols.map((c,ci)=>c.blocks.map(b=>`<div class="outline-item ${UI.sel&&UI.sel.block===b.id?'on':''}" data-pick-block="${b.id}" style="padding-left:28px">${ic(BY_ID[b.type].icon,13)}${esc(b.props.title||BY_ID[b.type].name)}${r.cols.length>1?`<span class="muted small">· col ${ci+1}</span>`:''}</div>`).join('')).join('')}`).join(''):'<p class="muted small">Nothing on the page yet.</p>'}</div>`;}
 return h;}

/* ---------- properties panel ---------- */
function F(label,ctrl,hint){return `<label class="field">${label}${ctrl}${hint?`<span class="hint">${hint}</span>`:''}</label>`;}
function selOpts(key,opts,val){return `<select class="select" data-prop="${key}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function renderProps(page){
 if(UI.sel&&UI.sel.block){const f=findBlock(UI.sel.block);if(!f){UI.sel=null;return renderProps(page);}const b=f.b,c=BY_ID[b.type],p=b.props;const role=roleOf(page.portal);const ok=c.roles.includes(role);
  let h=`<div class="props-head"><div class="label">Selected section</div><div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="icon-box navy">${ic(c.icon,16)}</span><div style="min-width:0"><div class="strong">${esc(c.name)}</div><div class="small muted">${c.portal==='basic'||c.portal==='field'?'Basic block':'From '+esc(portal(c.portal).name)+' › '+esc(c.page)}</div></div></div></div>`;
  if(!ok)h+=`<div class="props-sec"><div class="alert warning">${ic('alert',16)}<span><b>Not available for ${esc(portal(page.portal).name)} users.</b> ${c.portal==='super-admin'?'It performs admin-only actions.':'It needs data this portal can\'t access.'} It stays on the canvas but is hidden when published.</span></div></div>`;
  h+=`<div class="props-sec"><span class="label">Content</span>`;
  if(c.kind!=='heading'&&c.kind!=='divider'&&c.kind!=='field')h+=F('Section title',`<input class="input" data-prop="title" value="${esc(p.title)}">`)+`<label class="toggle">Show title<input type="checkbox" data-prop="showTitle" ${p.showTitle?'checked':''}></label>`;
  if(c.kind==='heading')h+=F('Text',`<input class="input" data-prop="text" value="${esc(p.text)}">`)+F('Size',selOpts('size',['Small','Medium','Large'],p.size||'Medium'))+F('Align',selOpts('align',['Left','Center','Right'],p.align||'Left'));
  if(c.kind==='text')h+=F('Text',`<textarea class="textarea" rows="4" data-prop="text">${esc(p.text)}</textarea>`);
  if(c.kind==='button')h+=F('Label',`<input class="input" data-prop="label" value="${esc(p.label)}">`)+F('Style',selOpts('style',['Primary','Gold','Outline'],p.style))+F('Opens',selOpts('link',['— choose a page —',...S.pages.map(x=>x.name),'External link…'],p.link));
  if(c.kind==='alert')h+=F('Message',`<textarea class="textarea" rows="3" data-prop="text">${esc(p.text)}</textarea>`)+F('Colour',selOpts('tone',['gold','info','success','warning','danger'],p.tone));
  if(c.kind==='image')h+=F('Image',`<span class="btn btn-sm">${ic('upload',13)} Upload image</span>`)+F('Alt text (for screen readers)',`<input class="input" data-prop="alt" value="${esc(p.alt||'')}">`);
  if(c.kind==='table')h+=`<label class="toggle">Search box<input type="checkbox" data-prop="search" ${p.search?'checked':''}></label><label class="toggle">Export to CSV<input type="checkbox" data-prop="export" ${p.export?'checked':''}></label>`+F('Rows per page',selOpts('perPage',['10','25','50'],p.perPage||'10'));
  if(c.kind==='form'&&b.type==='b-form')h+=F('Button label',`<input class="input" data-prop="submit" value="${esc(p.submit)}">`)+F('Save answers to',`<input class="input" data-prop="saveTo" value="${esc(p.saveTo)}">`,'Creates a new data set the first time the page is published.');
  if(c.kind==='field')h+=F('Label',`<input class="input" data-prop="label" value="${esc(p.label)}">`)+F('Field type',selOpts('ftype',['Text','Number','Dropdown','Date','File','Checkbox','Long text','Email','Phone'],p.ftype))+(p.ftype==='Dropdown'?F('Options',`<input class="input" data-prop="options" value="${esc(p.options)}">`,'Comma separated'):'')+`<label class="toggle">Required<input type="checkbox" data-prop="required" ${p.required?'checked':''}></label>`;
  h+=`</div>`;
  if(['tiles','chart','table','list','cards','form','copied'].includes(c.kind))h+=itemsEditor(b);
  if(c.data&&c.data!=='—'&&c.portal!=='basic'&&c.portal!=='field')h+=`<div class="props-sec"><span class="label">Data (automatic)</span><div class="box" style="padding:12px;background:var(--info-soft);border:0"><div class="small" style="color:var(--info-text)"><b>Reads:</b> ${esc(c.data)}<br><b>Shows:</b> ${esc(scopeText(page))}</div></div>${F('Filter by course',selOpts('course',COURSES,p.course))}<p class="small muted">The same section shows different data on each portal — you never type data in.</p></div>`;
  h+=`<div class="props-sec"><span class="label">Visibility</span><label class="toggle">View only (no editing or approving)<input type="checkbox" data-prop="readOnly" ${p.readOnly?'checked':''}></label><label class="toggle">Hide on phones<input type="checkbox" data-prop="hideMobile" ${p.hideMobile?'checked':''}></label><label class="toggle">Only show after certificate eligible<input type="checkbox" data-prop="gated" ${p.gated?'checked':''}></label></div>`;
  h+=`<div class="props-sec"><div class="row"><button class="btn btn-sm" data-act="blk-dup" data-block="${b.id}">${ic('copy',13)} Duplicate</button><button class="btn btn-sm btn-danger-o" data-act="blk-del" data-block="${b.id}">${ic('trash',13)} Delete section</button></div></div>`;
  return h;}
 if(UI.sel&&UI.sel.row){const r=page.rows.find(x=>x.id===UI.sel.row);if(!r){UI.sel=null;return renderProps(page);}
  return `<div class="props-head"><div class="label">Selected row</div><div class="strong" style="margin-top:4px">Row ${page.rows.indexOf(r)+1} · ${LAYOUT_NAMES[r.layout]}</div></div><div class="props-sec"><span class="label">Columns</span><div class="grid" style="--min:120px;gap:8px">${Object.keys(LAYOUTS).map(k=>`<button class="layout-tile" data-setlayout="${k}" style="cursor:pointer;${r.layout===k?'border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)':''}"><div class="lt" style="grid-template-columns:${cols(k)}">${LAYOUTS[k].map(()=>'<span></span>').join('')}</div>${LAYOUT_NAMES[k]}</button>`).join('')}</div><p class="small muted">Fewer columns? Sections from removed columns move into the last one — nothing is lost.</p></div><div class="props-sec"><div class="row"><button class="btn btn-sm" data-act="row-dup" data-row="${r.id}">${ic('copy',13)} Duplicate row</button><button class="btn btn-sm btn-danger-o" data-act="row-del" data-row="${r.id}">${ic('trash',13)} Delete row</button></div></div>`;}
 // page settings
 const menu=S.menus[page.portal]||[];
 return `<div class="props-head"><div class="label">Page settings</div><div class="strong" style="margin-top:4px">${esc(page.name)}</div></div>
 <div class="props-sec">${F('Page name',`<input class="input" data-page="name" value="${esc(page.name)}">`)}${F('Subtitle',`<input class="input" data-page="subtitle" value="${esc(page.subtitle||'')}">`)}${F('Icon',`<select class="select" data-page="icon">${['file','briefcase','target','book','chart','calendar','users','award','message','layers'].map(i=>`<option ${page.icon===i?'selected':''}>${i}</option>`).join('')}</select>`)}</div>
 <div class="props-sec"><span class="label">Portal &amp; menu</span><div class="box" style="padding:12px;display:flex;gap:10px;align-items:center"><span class="icon-box navy">${ic(portal(page.portal).icon,16)}</span><div><div class="strong">${esc(portal(page.portal).name)}</div><div class="small muted">Shows: ${esc(scopeText(page))}</div></div></div>
 ${F('Menu position',`<select class="select" data-page="menuPos"><option value="">Hidden (direct link only)</option><option value="top" ${menuPosOf(page)==='top'?'selected':''}>New top-menu item</option>${menu.map(m=>`<option value="${m.id}" ${menuPosOf(page)===m.id?'selected':''}>Inside “${esc(m.label)}”</option>`).join('')}</select>`,'Change the order in the Menus tab.')}</div>
 <div class="props-sec"><span class="label">Who can open it</span>${S.portals.filter(p=>p.id!=='public').map(p=>`<label class="check"><input type="checkbox" ${p.id===page.portal||p.id==='super-admin'?'checked':''} ${p.id==='super-admin'?'disabled':''}> ${esc(p.name)}${p.id==='super-admin'?' <span class="muted small">(always)</span>':''}</label>`).join('')}</div>
 <div class="props-sec"><span class="label">Tip</span><div class="shortcuts"><span><span class="kbd">Ctrl Z</span> undo</span><span><span class="kbd">Ctrl Y</span> redo</span><span><span class="kbd">Del</span> remove selected</span><span><span class="kbd">Esc</span> deselect</span></div></div>
 <div class="props-sec"><button class="btn btn-sm btn-danger-o" data-delpage="${page.id}">${ic('trash',13)} Delete this page…</button></div>`;

function itemsEditor(b){const it=itemsOf(b),k=BY_ID[b.type].kind;const name={tiles:'Tiles',chart:'Bars',table:'Columns',list:'Rows',cards:'Cards',form:'Fields',copied:'Items'}[k];const one=name.replace(/s$/,'').toLowerCase();

function subDelete(bid,i){const f=findBlock(bid);if(!f)return;snap();const it=itemsOf(f.b);const [x]=it.splice(i,1);(f.b.props.removed=f.b.props.removed||[]).push(x);UI.sel={block:bid};touch(`Removed “${x.label}” — restore it from the settings panel`);render();}
function subMove(bid,from,to){const f=findBlock(bid);if(!f)return;const it=itemsOf(f.b);if(to<0||to>=it.length||from===to)return;snap();const [x]=it.splice(from,1);it.splice(to,0,x);UI.sel={block:bid};touch();render();}
function menuPosOf(page){const menu=S.menus[page.portal]||[];for(const m of menu){if(m.pageId===page.id)return 'top';if(m.children.some(c=>c.pageId===page.id))return m.id;}return '';}
function setMenuPos(page,pos){const menu=S.menus[page.portal]||(S.menus[page.portal]=[]);
 for(let i=menu.length-1;i>=0;i--){if(menu[i].pageId===page.id)menu.splice(i,1);else menu[i].children=menu[i].children.filter(c=>c.pageId!==page.id);}
 if(pos==='top')menu.push({id:uid('m'),label:page.name,icon:page.icon||'file',pageId:page.id,children:[]});
 else if(pos){const m=menu.find(x=>x.id===pos);m&&m.children.push({id:uid('m'),label:page.name,pageId:page.id});}}

function genPw(){const c='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$';return Array.from({length:12},()=>c[Math.floor(Math.random()*c.length)]).join('');}
function dangerModal({title,lead,impacts,confirmText,button,onConfirm}){
 modal(`<div class="danger-head"><span class="icon-box">${ic('trash',20)}</span><div><h2>${esc(title)}</h2><p class="muted small" style="margin-top:4px">${lead}</p></div></div><ul class="impact">${impacts.map(i=>`<li>${ic('x',15)}<span>${i}</span></li>`).join('')}</ul>
 <div class="alert warning" style="margin-top:14px">${ic('alert',16)}<span>This is permanent. It is removed from the database, not just hidden — it can't be restored.</span></div>
 <label class="field" style="margin-top:16px"><span>Type <span class="mono" style="background:var(--surface);padding:1px 6px;border-radius:4px">${esc(confirmText)}</span> to confirm</span><input class="input" id="dz-confirm" autocomplete="off"></label>
 <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn btn-danger" id="dz-go" disabled>${ic('trash',14)} ${esc(button)}</button></div>`);
 const inp=document.getElementById('dz-confirm'),go=document.getElementById('dz-go');inp.focus();inp.oninput=()=>go.disabled=inp.value.trim()!==confirmText;go.onclick=()=>{closeModal();onConfirm();};}
function deletePage(id){const p=S.pages.find(x=>x.id===id);const n=p.rows.reduce((a,r)=>a+r.cols.reduce((x,c)=>x+c.blocks.length,0),0);const forms=p.rows.some(r=>r.cols.some(c=>c.blocks.some(b=>b.type==='b-form')));
 dangerModal({title:`Delete “${p.name}”?`,lead:`${esc(portal(p.portal).name)} page · ${esc(p.status)}`,impacts:[`The page and its <b>${n} sections</b>`,forms?`All <b>${p.records} records</b> people saved through this page's form`:'No saved form data on this page',`Its menu link — users will no longer see it`,`Its version history`],confirmText:p.name,button:'Delete page',
  onConfirm:()=>{S.pages=S.pages.filter(x=>x.id!==id);setMenuPosAll(id);log(`Deleted page “${p.name}” and its data`);if(UI.pageId===id){UI.pageId=null;UI.view='pages';}render();toast(`“${p.name}” and its data were permanently deleted`);}});}
function setMenuPosAll(id){Object.values(S.menus).forEach(menu=>{for(let i=menu.length-1;i>=0;i--){if(menu[i].pageId===id)menu.splice(i,1);else menu[i].children=menu[i].children.filter(c=>c.pageId!==id);}});}
function deleteUser(id){const u=S.users.find(x=>x.id===id);
 dangerModal({title:`Delete ${u.name}?`,lead:`${esc(u.email)} · ${esc(portal(u.portal).name)}`,impacts:[`<b>Login stops working immediately</b> — every open session is signed out`,`Their profile, photo and CV`,`All their data: <b>${u.records} records</b> (attendance, submissions, requests)`,`The email becomes free — a new account would start from zero`],confirmText:u.email,button:'Delete user & data',

function deletePortal(id){const p=portal(id);const pages=S.pages.filter(x=>x.portal===id),users=S.users.filter(u=>u.portal===id);
 dangerModal({title:`Delete the “${p.name}” account type?`,lead:`Custom portal based on ${esc(portal(p.basedOn).name)}`,impacts:[`<b>${users.length} user${users.length===1?'':'s'}</b> — their logins stop working immediately`,`All data belonging to those users`,`<b>${pages.length} built page${pages.length===1?'':'s'}</b> and anything saved through them`,`The portal's menu and settings`],confirmText:p.name,button:'Delete everything',
  onConfirm:()=>{S.pages=S.pages.filter(x=>x.portal!==id);S.users=S.users.filter(u=>u.portal!==id);S.portals=S.portals.filter(x=>x.id!==id);delete S.menus[id];log(`Deleted portal “${p.name}”, ${users.length} users and ${pages.length} pages`);if(curPage()==null)UI.pageId=null;render();toast(`“${p.name}” and all its users, pages and data were deleted`);}});}

function makeSet(portalId,rootId,forUser,name){
 const ids=rootId?sysDesc(portalId,rootId):(SYS[portalId]||[]).map(p=>p.id);
 const pages=ids.map(id=>{const sp=sysPage(portalId,id);return {id,name:sp.name,parent:rootId===id?null:sp.parent,deleted:false,els:sp.els.map(e=>({id:uid('e'),label:e.label,kind:e.kind,deleted:false,items:e.items.map(i=>({id:uid('i'),label:i.label,to:i.to,deleted:false}))}))};});
 const set={id:uid('set'),name:name||(rootId?sysPage(portalId,rootId).name+' (copy)':portal(portalId).name+' portal (copy)'),source:portalId,forUser:forUser||null,pages,log:[],saved:false,created:now()};
 S.sets.unshift(set);save();return set;}
const tp=(set,id)=>set.pages.find(p=>p.id===id);
const tLive=(set,id)=>{const p=tp(set,id);return !!p&&!p.deleted;};
const tKids=(set,id)=>set.pages.filter(p=>p.parent===id&&!p.deleted);
function tIsInner(set,page,target){let p=tp(set,target);while(p){if(p.parent===page.id)return true;p=tp(set,p.parent);}return false;}
/* link state of an item: 'inner' (opens a live inner page → Open, no delete), 'gone' (target deleted → hide), 'shortcut' (other live page → deletable + go), null (plain) */
function tLink(set,page,item){if(!item.to)return null;const t=tp(set,item.to);if(!t)return null;if(t.deleted)return 'gone';return tIsInner(set,page,item.to)?'inner':'shortcut';}
const tItems=(set,page,el)=>el.items.filter(i=>!i.deleted&&tLink(set,page,i)!=='gone');
const tEls=(set,page)=>page.els.filter(e=>!e.deleted&&!(e.items.length&&e.items.every(i=>i.deleted||tLink(set,page,i)==='gone')&&e.items.some(i=>tLink(set,page,i)==='gone')));
const tHasInner=(set,page,el)=>tItems(set,page,el).some(i=>tLink(set,page,i)==='inner');
function tCount(set){const pages=set.pages.filter(p=>!p.deleted);let els=0,items=0;pages.forEach(p=>tEls(set,p).forEach(e=>{els++;items+=tItems(set,p,e).length;}));return {pages:pages.length,els,items};}

 return `<div class="trim"><div class="edbar"><div class="row"><button class="btn btn-sm" data-view="pages">${ic('arrowL',13)} Pages</button><b>${esc(set.name)}</b><span class="pill">Copied from ${esc(by.name)}</span>${set.forUser?`<span class="pill gold">${ic('user',11)} ${esc(set.forUser.name)}</span>`:''}${set.saved?'<span class="pill success">Saved</span>':'<span class="pill">Not saved</span>'}</div>

function tLog(set,entry){set.log.push(entry);set.saved=false;save();}
function tAct(d){const set=curSet();
 if(d.tpage){UI.trimPage=d.tpage;render();return true;}
 if(d.tdelpage){const p=tp(set,d.tdelpage);if(tKids(set,p.id).length){toast('Delete its inner pages first',true);return true;}
  const links=set.pages.filter(x=>!x.deleted).reduce((a,x)=>a+x.els.reduce((b,e)=>b+e.items.filter(i=>!i.deleted&&i.to===p.id).length,0),0);
  p.deleted=true;tLog(set,{type:'page',page:p.id,label:p.name});if(UI.trimPage===p.id)UI.trimPage=p.parent;render();toast(`Deleted “${p.name}”${links?` — ${links} link${links>1?'s':''} to it removed too`:''}`);return true;}
 if(d.teldel){const pg=tp(set,UI.trimPage);const e=pg.els.find(x=>x.id===d.teldel);e.deleted=true;tLog(set,{type:'box',page:pg.id,el:e.id,label:pg.name+' › '+e.label});render();toast(`Deleted “${e.label}”`);return true;}
 if(d.titemdel){const pg=tp(set,UI.trimPage);const [eid,iid]=d.titemdel.split(':');const e=pg.els.find(x=>x.id===eid);const it=e.items.find(x=>x.id===iid);it.deleted=true;tLog(set,{type:'item',page:pg.id,el:eid,item:iid,label:e.label+' › '+it.label});render();toast(`Removed “${it.label}”`);return true;}
 if(d.telmove){const pg=tp(set,UI.trimPage);const [eid,dd]=d.telmove.split(':');const vis=tEls(set,pg);const i=vis.findIndex(x=>x.id===eid),j=i+(+dd);if(j<0||j>=vis.length)return true;const a=pg.els.indexOf(vis[i]),b=pg.els.indexOf(vis[j]);[pg.els[a],pg.els[b]]=[pg.els[b],pg.els[a]];set.saved=false;save();render();return true;}
 if(d.trestore){const r=set.log.splice(+d.trestore,1)[0];const pg=tp(set,r.page);if(r.type==='page')pg.deleted=false;if(r.type==='box')pg.els.find(x=>x.id===r.el).deleted=false;if(r.type==='item')pg.els.find(x=>x.id===r.el).items.find(x=>x.id===r.item).deleted=false;set.saved=false;save();render();toast(`Restored “${r.label}”`);return true;}

/* turn a trimmed copy into real, editable pages (and an account if it's for an employee) */
function tSave(set){
 let pid=set.portalId;
 if(!pid){pid=uid('portal-');set.portalId=pid;S.portals.push({id:pid,name:set.forUser?set.forUser.role||(set.forUser.name+' access'):set.name.replace(' (copy)',''),builtin:false,basedOn:roleOf(set.source)||'super-admin',scope:set.forUser?'Only what was kept in “'+set.name+'”':portal(set.source).scope,icon:'target'});S.menus[pid]=[];}
 S.pages=S.pages.filter(p=>p.fromSet!==set.id);S.menus[pid]=[];
 set.pages.filter(p=>!p.deleted).forEach(p=>{const rows=tEls(set,p).map(e=>{const b=newBlock('x-copied');b.props.title=e.label;b.props.kindOrig=e.kind;b.props.items=tItems(set,p,e).map(i=>{const [l,v]=i.label.split(' · ');return {id:uid('i'),label:l,value:v||'',type:'Text'};});return {id:uid('r'),layout:'1',cols:[{id:uid('c'),blocks:[b]}]};});
  const page={id:uid('p'),name:p.name,subtitle:'',portal:pid,icon:p.parent?'file':'layers',status:'Draft',updated:now(),records:0,rows,fromSet:set.id};S.pages.push(page);
  if(!p.parent)S.menus[pid].push({id:uid('m'),label:p.name,icon:'file',pageId:page.id,children:[]});});
 S.pages.filter(x=>x.fromSet===set.id).forEach(pg=>{const sp=set.pages.find(q=>q.name===pg.name&&!q.deleted);if(sp&&sp.parent){const parentPg=set.pages.find(q=>q.id===sp.parent);const m=S.menus[pid].find(mm=>mm.label===parentPg.name);m&&m.children.push({id:uid('m'),label:pg.name,pageId:pg.id});}});
 if(set.forUser&&!S.users.some(u=>u.email===set.forUser.email))S.users.unshift({id:uid('u-'),name:set.forUser.name,email:set.forUser.email,portal:pid,org:set.forUser.org||'Learn Being Forward',status:'Active',records:0});

 const viewOnly=/(view only|read only|only view|only see|cannot edit|can't edit|no edit|just see|only check)/.test(t);
 let scope=null;const m=t.match(/(crestview|pinnacle|global|sunrise|horizon)/g);if(m)scope='Only '+[...new Set(m)].map(x=>x[0].toUpperCase()+x.slice(1)).join(', ');

function aiAct(d,t){const A=UI.ai;
 if(d.aigenpw!==undefined){A.pw=genPw();render();return true;}
 if(d.aisuggest!==undefined){const r=aiParse(A.text||'');if(!Object.keys(r.caps).length){toast('No matching parts found — pick them below',true);}Object.assign(A.caps,r.caps);A.why=r.why;if(r.viewOnly){A.viewOnlyHit=1;CAPS.forEach(c=>A.access[c.id]='view');}if(r.scope){A.scope=r.scope;A.scopeHit=1;}A.outline=null;render();if(Object.keys(r.caps).length)toast(`Picked ${Object.keys(r.caps).length} parts from your description`);return true;}
 if(d.aicap){A.caps[d.aicap]=!A.caps[d.aicap];A.outline=null;render();return true;}
 if(d.aistep){A.step=+d.aistep;render();return true;}
 if(d.ainext!==undefined){
  if(A.step===1){const b=document.querySelector('[name=ai-base]:checked');A.base=b?b.value:A.base;if(!A.name.trim()||!/.+@.+\..+/.test(A.email)){toast('Enter a name and a valid email',true);return true;}if(S.users.some(u=>u.email.toLowerCase()===A.email.toLowerCase())){toast('That email already has an account',true);return true;}if(A.pw.length<8){toast('Password needs at least 8 characters',true);return true;}}
  if(A.step===2&&!Object.values(A.caps).some(Boolean)){toast('Pick at least one part, or describe what they need',true);return true;}
  if(A.step===4){aiBuild();return true;}
  A.step++;render();return true;}
 if(d.aidelpage){A.outline.splice(+d.aidelpage,1);render();return true;}
 if(d.aidelsec){const [pi,si]=d.aidelsec.split(':').map(Number);A.outline[pi].sections.splice(si,1);render();return true;}
 if(d.ainew!==undefined){UI.ai=aiDefault();render();return true;}
 if(d.aipublish!==undefined){const R=A.result;R.pages.forEach(id=>{const p=S.pages.find(x=>x.id===id);if(p)p.status='Published';});const u=S.users.find(x=>x.email===R.email);if(u)u.status='Active';log(`Published ${R.pages.length} pages for ${R.email}`);save();render();toast(`${R.name} can log in now`);return true;}
 return false;}
function aiBuild(){const A=UI.ai;const O=A.outline;const pid=uid('portal-');
 S.portals.push({id:pid,name:A.role||(A.name+' (custom)'),builtin:false,basedOn:A.base,scope:A.scope,icon:'target'});S.menus[pid]=[];const ids=[];
 O.forEach(p=>{const rows=[];
  p.sections.forEach(s=>{const b=newBlock(s.type);if(s.label==='Welcome heading'){b.props.text='Welcome, '+A.name.split(' ')[0];}
   if(p.key==='home'&&s.type==='b-tiles'){b.props.title='Your areas';b.props.items=O.filter(x=>x.key!=='home'&&x.key!=='profile').map(x=>({id:uid('i'),label:x.name,value:x.access==='view'?'View':'Edit'}));}
   if(p.key==='profile'){b.props.title=s.label;b.props.items=(s.label==='Change password'?['Current password','New password']:['Name','Email','Phone']).map(l=>({id:uid('i'),label:l,value:'',type:'Text'}));b.props.submit=s.label==='Change password'?'Change password':'Save';}
   if(p.access==='view')b.props.readOnly=true;rows.push({id:uid('r'),layout:'1',cols:[{id:uid('c'),blocks:[b]}]});});
  const page={id:uid('p'),name:p.name,subtitle:p.access==='view'?'View only':'',portal:pid,icon:p.icon,status:'Draft',updated:now(),records:0,rows};S.pages.push(page);ids.push(page.id);S.menus[pid].push({id:uid('m'),label:p.name,icon:p.icon,pageId:page.id,children:[]});});
 S.users.unshift({id:uid('u-'),name:A.name,email:A.email,portal:pid,org:A.org,status:'Not active yet',records:0,phone:A.phone});
 A.result={name:A.name,email:A.email,pw:A.pw,pages:ids};A.step=5;log(`AI Create built “${A.role||A.name}” with ${ids.length} pages for ${A.email}`);save();render();toast(`Built ${ids.length} pages — open any to delete boxes, then publish`);}

/* password show / hide on every password field */
function enhancePw(root){(root||document).querySelectorAll('input[type=password]:not([data-pw-done])').forEach(inp=>{inp.dataset.pwDone='1';const w=document.createElement('span');w.className='pw-wrap';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
 const b=document.createElement('button');b.type='button';b.className='pw-eye';b.setAttribute('aria-label','Show password');b.setAttribute('aria-pressed','false');b.innerHTML=ic('eye',16);
 b.onclick=()=>{const show=inp.type==='password';inp.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'Hide password':'Show password');b.innerHTML=show?EYE_OFF:ic('eye',16);};w.appendChild(b);});}
const EYE_OFF='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7c2 0 3.8.7 5.3 1.7M22 12s-4 7-10 7c-2 0-3.8-.7-5.3-1.7"/><path d="M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

 if(d.giveaccess!==undefined){openGiveAccess();return;}
 if(d.openset){UI.setId=d.openset;UI.trimPage=null;UI.view='trim';render();return;}
 if(d.delset){const st=S.sets.find(x=>x.id===d.delset);dangerModal({title:`Delete the copy “${st.name}”?`,lead:'Working copy',impacts:['The working copy and its list of removed items',st.saved?'Pages already saved from it stay — delete them from the Pages list if needed':'Nothing was saved from it yet'],confirmText:st.name,button:'Delete copy',onConfirm:()=>{S.sets=S.sets.filter(x=>x.id!==st.id);log(`Deleted copy “${st.name}”`);render();toast('Copy deleted');}});return;}
 if(d.view){e.preventDefault();UI.view=d.view;render();return;}
 if(d.newpage!==undefined){openNewPage(d.newpage||null);return;}
 if(d.newportal!==undefined){openNewPortal();return;}
 if(d.newuser!==undefined){openNewUser();return;}
 if(d.edit&&!t.hasAttribute('contenteditable')){openEditor(d.edit);return;}
 if(d.preview){openPreview(d.preview);return;}
 if(d.duppage){const p=S.pages.find(x=>x.id===d.duppage);const c=JSON.parse(JSON.stringify(p));c.id=uid('p');c.name=p.name+' (copy)';c.status='Draft';c.updated=now();c.records=0;S.pages.unshift(c);log(`Duplicated “${p.name}”`,c.id);render();toast('Copy created as a draft');return;}
 if(d.delpage){deletePage(d.delpage);return;}
 if(d.copysys){const role=d.portal;const map={student:[['1',['stu-welcome']],['1',['stu-course']],['1',['stu-placement']]],college:[['1',['col-tiles']],['2a',['col-attchart'],['col-breakdown']]],trainer:[['1',['tr-mark']]],'super-admin':[['2a',['sa-requests'],['sa-notifs']]],public:[['1',['pub-hero']],['1',['pub-stats']],['1',['pub-pillars']]]};
  const page={id:uid('p'),name:d.copysys.split('›').pop().trim()+' (copy)',subtitle:'',portal:role,icon:'file',status:'Draft',updated:now(),records:0,rows:(map[role]||[]).map(([lay,...cs])=>({id:uid('r'),layout:lay,cols:cs.map(l=>({id:uid('c'),blocks:l.map(newBlock)}))}))};
  S.pages.unshift(page);log(`Copied system page “${d.copysys}”`,page.id);openEditor(page.id);toast('Copied — edit it freely, the original stays untouched');return;}
 if(d.subdel){e.stopPropagation();const [bid,i]=d.subdel.split(':');subDelete(bid,+i);return;}
 if(d.itemmove){const [i,dd]=d.itemmove.split(':').map(Number);subMove(UI.sel.block,i,i+dd);return;}
 if(d.itemadd!==undefined){const f=findBlock(UI.sel.block);snap();const k=BY_ID[f.b.type].kind;itemsOf(f.b).push({id:uid('i'),label:k==='form'?'New field':k==='table'?'New column':'New item',value:'0',type:'Text'});touch('Added');render();return;}
 if(d.itemrestore){const f=findBlock(UI.sel.block);snap();const [x]=f.b.props.removed.splice(+d.itemrestore,1);itemsOf(f.b).push(x);touch(`Restored “${x.label}”`);render();return;}
 if(d.act){e.stopPropagation();act(d.act,t);return;}
 if(d.libtab){UI.libTab=d.libtab;render();return;}
 if(d.addClick){e.stopPropagation();const s=UI.sel;let target=null;if(s&&s.block){const f=findBlock(s.block);target={row:f.r.id,col:f.c.id,index:f.i+1};}else if(s&&s.row){const r=curPage().rows.find(x=>x.id===s.row);const c=r.cols.find(x=>!x.blocks.length)||r.cols[r.cols.length-1];target={row:r.id,col:c.id,index:c.blocks.length};}addBlock(d.addClick,target);return;}
 if(d.addrow){addRow(d.addrow);return;}
 if(d.device){UI.device=d.device;render();return;}
 if(d.undo!==undefined){doUndo();return;}if(d.redo!==undefined){doRedo();return;}
 if(d.publish!==undefined){const p=curPage();const hidden=p.rows.reduce((a,r)=>a+r.cols.reduce((x,c)=>x+c.blocks.filter(b=>!BY_ID[b.type].roles.includes(roleOf(p.portal))).length,0),0);p.status='Published';p.updated=now();log(`Published “${p.name}”`,p.id);render();toast(hidden?`Published — ${hidden} admin-only section(s) stay hidden for users`:'Published — users can see it now');return;}
 if(d.setlayout){setLayout(UI.sel.row,d.setlayout);return;}
 if(d.pickRow){UI.sel={row:d.pickRow};render();return;}
 if(d.pickBlock){UI.sel={block:d.pickBlock};render();document.querySelector(`[data-block="${d.pickBlock}"]`)?.scrollIntoView({block:'center',behavior:'smooth'});return;}
 if(d.deluser){deleteUser(d.deluser);return;}if(d.delportal){deletePortal(d.delportal);return;}
 if(d.resetpw){const u=S.users.find(x=>x.id===d.resetpw);const pw=genPw();modal(`<h2>New password for ${esc(u.name)}</h2><p class="muted small" style="margin-top:4px">Their old password stops working now.</p><input class="input mono" type="password" readonly value="${pw}" style="margin-top:14px" aria-label="New password"><div class="foot"><button class="btn btn-primary" data-close>Done</button></div>`);log(`Reset password for ${u.email}`);return;}
 if(d.toggleuser){const u=S.users.find(x=>x.id===d.toggleuser);u.status=u.status==='Active'?'Disabled':'Active';log(`${u.status==='Active'?'Enabled':'Disabled'} ${u.email}`);render();toast(u.status==='Active'?'Login enabled':'Login disabled — data kept');return;}
 if(d.menus){UI.menuPortal=d.menus;UI.view='menus';render();return;}
 if(d.mup||d.mdown){const m=S.menus[UI.menuPortal||'student'];const i=+(d.mup||d.mdown),j=i+(d.mup?-1:1);if(j>=0&&j<m.length){[m[i],m[j]]=[m[j],m[i]];save();render();}return;}
 if(d.mremove){const m=S.menus[UI.menuPortal||'student'];const [i,ci]=d.mremove.split('.').map(Number);if(ci>=0)m[i].children.splice(ci,1);else m.splice(i,1);save();render();toast('Removed from menu — the page still exists');return;}
 if(d.reset!==undefined){if(confirmReset()){S=seed();save();UI.view='pages';render();toast('Demo data reset');}return;}
 if(t.classList.contains('blk')){UI.sel={block:t.dataset.block};render();return;}
 if(t.classList.contains('cv-row')){UI.sel={row:t.dataset.row};render();return;}
 if(t.classList.contains('stage')&&!e.target.closest('[contenteditable]')){if(UI.sel){UI.sel=null;render();}return;}
});
function confirmReset(){return true;}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.prop){const f=findBlock(UI.sel.block);if(!f)return;if(!UI._typing){snap();UI._typing=1;setTimeout(()=>UI._typing=0,800);}f.b.props[t.dataset.prop]=t.type==='checkbox'?t.checked:t.value;touch();
  const el=document.querySelector(`[data-block="${f.b.id}"]`);if(el){const tools=el.querySelector('.blk-tools').outerHTML,tag=el.querySelector('.blk-tag').outerHTML;el.innerHTML=tag+tools+renderBlock(f.b,curPage());}
  if(t.tagName==='SELECT'||t.type==='checkbox')render();return;}
 if(t.dataset.ai){UI.ai[t.dataset.ai]=t.value;if(t.dataset.ai==='text'){UI.ai.why={};}return;}
 if(t.dataset.item){const f=findBlock(UI.sel.block);if(!f)return;if(!UI._typing){snap();UI._typing=1;setTimeout(()=>UI._typing=0,800);}itemsOf(f.b)[+t.dataset.item][t.dataset.f]=t.value;touch();if(t.tagName==='SELECT'){render();return;}
  const el=document.querySelector(`[data-block="${f.b.id}"]`);if(el){const tools=el.querySelector('.blk-tools').outerHTML,tag=el.querySelector('.blk-tag').outerHTML;el.innerHTML=tag+tools+renderBlock(f.b,curPage());bindSubs(el);}return;}
 if(t.dataset.page){const p=curPage();if(t.dataset.page==='menuPos'){setMenuPos(p,t.value);touch('Menu updated');render();return;}p[t.dataset.page]=t.value;touch();if(t.tagName==='SELECT')render();else{const h=document.querySelector(`.cv-title [data-edit="${t.dataset.page}"]`);h&&(h.textContent=t.value);document.querySelector('.pname').textContent=p.name;}return;}
 if(t.id==='libq'){UI.libQ=t.value;const pos=t.selectionStart;render();const n=document.getElementById('libq');n.focus();n.setSelectionRange(pos,pos);return;}
 if(t.id==='uq'){UI.uq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('uq');n.focus();n.setSelectionRange(pos,pos);return;}
 if(t.id==='lq'){UI.lq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('lq');n.focus();n.setSelectionRange(pos,pos);return;}
 if(t.dataset.rename){const m=S.menus[UI.menuPortal||'student'];const [i,ci]=t.dataset.rename.split('.').map(Number);(ci>=0?m[i].children[ci]:m[i]).label=t.value;save();return;}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.aiacc){UI.ai.access[t.dataset.aiacc]=t.value;UI.ai.outline=null;}
 if(t.name==='ai-base'){UI.ai.base=t.value;}
 if(t.id==='pfilter'){UI.pfilter=t.value;render();}if(t.id==='ufilter'){UI.ufilter=t.value;render();}if(t.id==='menuPortal'){UI.menuPortal=t.value;render();}
 if(t.dataset.placepage){const p=S.pages.find(x=>x.id===t.dataset.placepage);setMenuPos(p,t.value);save();render();toast('Added to menu');}
 if(t.dataset.rename)render();
});
document.addEventListener('toggle',e=>{const g=e.target.closest&&e.target.closest('.lib-group');if(g)UI.openGroups[g.dataset.group]=g.open?1:0;},true);
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.edit&&t.hasAttribute('contenteditable')){const p=curPage();const v=t.textContent.trim();if(v&&v!==p[t.dataset.edit]){snap();p[t.dataset.edit]=v;touch('Saved');render();}}});
document.addEventListener('keydown',e=>{
 if(e.target.closest('[contenteditable]')&&e.key==='Enter'){e.preventDefault();e.target.blur();return;}
 if(document.getElementById('modal-root').innerHTML&&e.key==='Escape'){closeModal();return;}
 if(UI.view!=='editor'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo();}
 else if((e.key==='Delete'||e.key==='Backspace')&&UI.sel){e.preventDefault();if(UI.sel.block)act('blk-del',{dataset:{block:UI.sel.block}});else if(UI.sel.row)act('row-del',{dataset:{row:UI.sel.row}});}
 else if(e.key==='Escape'&&UI.sel){UI.sel=null;render();}
 else if(e.key==='Enter'&&e.target.classList.contains('blk')){UI.sel={block:e.target.dataset.block};render();}
});

/* ---------- drag & drop ---------- */
let DRAG=null;
function bindSubs(root){root.querySelectorAll('.sub[draggable]').forEach(el=>{
  el.addEventListener('dragstart',e=>{e.stopPropagation();DRAG={sub:el.dataset.subb,from:+el.dataset.subi};e.dataTransfer.setData('text/plain','sub');e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragover',e=>{if(DRAG&&DRAG.sub===el.dataset.subb){e.preventDefault();e.stopPropagation();el.classList.add('subover');}});
  el.addEventListener('dragleave',()=>el.classList.remove('subover'));
  el.addEventListener('drop',e=>{if(!DRAG||DRAG.sub!==el.dataset.subb)return;e.preventDefault();e.stopPropagation();el.classList.remove('subover');const D=DRAG;DRAG=null;subMove(D.sub,D.from,+el.dataset.subi);});});}
function bindDnD(){
 document.querySelectorAll('[data-add]').forEach(el=>el.addEventListener('dragstart',e=>{DRAG={add:el.dataset.add};e.dataTransfer.setData('text/plain',el.dataset.add);e.dataTransfer.effectAllowed='copy';document.body.classList.add('dragging');}));
 document.querySelectorAll('[data-layout]').forEach(el=>el.addEventListener('dragstart',e=>{DRAG={layout:el.dataset.layout};e.dataTransfer.setData('text/plain',el.dataset.layout);document.body.classList.add('dragging');}));
 document.querySelectorAll('.blk[data-block]').forEach(el=>el.addEventListener('dragstart',e=>{DRAG={move:el.dataset.block};e.dataTransfer.setData('text/plain',el.dataset.block);e.dataTransfer.effectAllowed='move';setTimeout(()=>el.classList.add('dragging'),0);document.body.classList.add('dragging');}));
 document.querySelectorAll('[data-dz]').forEach(z=>{
  z.addEventListener('dragover',e=>{if(!DRAG)return;if(DRAG.layout&&z.dataset.dz!=='row')return;e.preventDefault();z.classList.add('over');});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const D=DRAG;DRAG=null;document.body.classList.remove('dragging');if(!D)return;
   const tgt=z.dataset.dz==='row'?{rowIndex:+z.dataset.index}:{row:z.dataset.row,col:z.dataset.col,index:+z.dataset.index};
   if(D.layout){addRow(D.layout,tgt.rowIndex);return;}
   if(D.add){addBlock(D.add,tgt);return;}
   if(D.move){moveBlock(D.move,tgt);}});});
 bindSubs(document);
 // auto-scroll the canvas while dragging near its top/bottom edge
 const st=document.getElementById('stage');if(st)st.addEventListener('dragover',e=>{if(!DRAG)return;const r=st.getBoundingClientRect();if(e.clientY>r.bottom-70)st.scrollTop+=22;else if(e.clientY<r.top+70)st.scrollTop-=22;});
 // menu reorder
 document.querySelectorAll('.mi[data-mi]').forEach(el=>{el.addEventListener('dragstart',e=>{DRAG={menu:+el.dataset.mi};e.dataTransfer.setData('text/plain','m');});
  el.addEventListener('dragover',e=>{if(DRAG&&DRAG.menu!=null){e.preventDefault();el.classList.add('dragover');}});el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');if(!DRAG||DRAG.menu==null)return;const m=S.menus[UI.menuPortal||'student'];const from=DRAG.menu,to=+el.dataset.mi;DRAG=null;const [x]=m.splice(from,1);m.splice(to,0,x);save();render();toast('Menu order saved');});});
}
document.addEventListener('dragend',()=>{DRAG=null;document.body.classList.remove('dragging');document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));});

render();
</script>
</body>
</html>
